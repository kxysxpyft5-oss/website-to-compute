<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع الحب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      text-align: center;
    }

    #loveText {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #nextBtn {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: white;
      border: 2px solid red;
      border-radius: 10px;
    }

    #imageContainer img {
      max-width: 80%;
      margin-top: 20px;
      display: none;
      border-radius: 15px;
    }
  </style>
</head>
<body>

  <!-- اكتب هنا الرسالة اللي انت عايزها -->
  <p id="loveText">اكتب هنا الرسالة اللي انت عايزها ❤️</p>
  <button id="nextBtn">التالي</button>

  <div id="imageContainer">
    <img id="img1" src="https://via.placeholder.com/250x250.png?text=صورة1">
    <img id="img2" src="https://via.placeholder.com/250x250.png?text=صورة2">
    <img id="img3" src="https://via.placeholder.com/250x250.png?text=صورة3">
  </div>

  <script>
    // استبدل الروابط بروابط صوركم بعد رفعها على imgbb أو أي موقع رفع صور
    const images = [
      "https://via.placeholder.com/250x250.png?text=صورة1",
      "https://via.placeholder.com/250x250.png?text=صورة2",
      "https://via.placeholder.com/250x250.png?text=صورة3"
    ];

    let current = 0;
    const btn = document.getElementById("nextBtn");
    const imgElements = document.querySelectorAll("#imageContainer img");

    btn.addEventListener("click", () => {
      if(current < images.length) {
        imgElements[current].style.display = "block"; // تظهر الصورة واحدة واحدة
        current++;
      } else {
        alert("خلصت الصور ❤️");
      }
    });
  </script>

</body>
</html>
